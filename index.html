<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Default head. @unhead/vue (src/App.vue + src/seo.js) overrides
         title / description / canonical / OG / Twitter / JSON-LD per route
         once the app mounts; these are the fallback for the first paint and
         for crawlers that don't run JS. -->
    <title>Why We Die — US Mortality &amp; Population Statistics</title>
    <meta
      name="description"
      content="Interactive US death, birth, and population statistics from the CDC — leading causes of death, birth and fertility rates, and natural increase, tracked from 1900 to today."
    />
    <link rel="canonical" href="https://whywedie.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Why We Die" />
    <meta property="og:title" content="Why We Die — US Mortality &amp; Population Statistics" />
    <meta
      property="og:description"
      content="Interactive US death, birth, and population statistics from the CDC, tracked from 1900 to today."
    />
    <meta property="og:url" content="https://whywedie.org/" />
    <meta property="og:image" content="https://whywedie.org/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
